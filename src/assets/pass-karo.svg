    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="250" y1="0" x2="250" y2="750"/>
    <line x1="550" y1="0" x2="550" y2="750"/>
    <line x1="850" y1="0" x2="850" y2="750"/>
  </g>

  <circle cx="780" cy="360" r="160" fill="#10b981" opacity="0.15" filter="url(#greenGlow)"/>

  <!-- Functional Dashboard Mockup Interface -->
  <g transform="translate(560, 160)">
    <!-- Main Window Container -->
    <rect width="560" height="420" rx="16" fill="#061f18" fill-opacity="0.95" stroke="#10b981" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="560" height="42" rx="16" fill="#022c22"/>
    <circle cx="25" cy="21" r="6" fill="#ef4444"/>
    <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="21" r="6" fill="#10b981"/>
    <text x="210" y="26" fill="#6ee7b7" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" letter-spacing="1">PASS KARO // ACADEMIC OS</text>

    <!-- Top Metric Cards -->
    <g transform="translate(25, 65)">
      <!-- Attendance Card -->
      <rect width="155" height="110" rx="10" fill="#0b2e25" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="16" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600">ATTENDANCE</text>
      <text x="16" y="65" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800">84.2%</text>
      <text x="16" y="90" fill="#10b981" font-family="monospace" font-size="11">✓ Above 75% Criteria</text>

      <!-- Target CGPA -->
      <rect x="175" y="0" width="155" height="110" rx="10" fill="#0b2e25" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="191" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600">ESTIMATED CGPA</text>
      <text x="191" y="65" fill="#67e8f9" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800">8.92</text>
      <text x="191" y="90" fill="#38bdf8" font-family="monospace" font-size="11">Top 5% Tier</text>

      <!-- BTech Credits -->
      <rect x="350" y="0" width="155" height="110" rx="10" fill="#0b2e25" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="366" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600">SEMESTER PASS</text>
      <text x="366" y="65" fill="#facc15" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800">SAFE</text>
      <text x="366" y="90" fill="#fbbf24" font-family="monospace" font-size="11">24/24 Credits</text>
    </g>

    <!-- Bottom Subject Table Simulation -->
    <g transform="translate(25, 200)">
      <rect width="510" height="195" rx="10" fill="#042018" stroke="#10b981" stroke-opacity="0.2"/>
      
      <!-- Table Header -->
