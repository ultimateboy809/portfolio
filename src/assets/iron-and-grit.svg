<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gymGlow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#180505" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080202" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#gymGlow)"/>

  <!-- High-Energy Angular Backdrop Lines -->
  <g opacity="0.15" stroke="#ef4444" stroke-width="1.5">
    <line x1="0" y1="100" x2="1200" y2="350"/>
    <line x1="0" y1="250" x2="1200" y2="500"/>
    <line x1="0" y1="400" x2="1200" y2="650"/>
    <line x1="500" y1="0" x2="700" y2="750"/>
    <line x1="850" y1="0" x2="1050" y2="750"/>
  </g>

  <!-- Crimson Core Light -->
  <circle cx="750" cy="360" r="180" fill="#dc2626" opacity="0.2" filter="url(#crimsonGlow)"/>

  <!-- 3D Barbell & Weight Plate Centerpiece -->
  <g transform="translate(740, 360) rotate(-12)">
    <!-- Olympic Bar Shaft -->
    <rect x="-380" y="-12" width="760" height="24" rx="6" fill="#4b5563" stroke="#9ca3af" stroke-width="2"/>
    <!-- Knurling Texture Pattern -->
    <g opacity="0.4" stroke="#e5e7eb" stroke-width="2">
      <line x1="-220" y1="-10" x2="-80" y2="10"/>
      <line x1="-200" y1="-10" x2="-60" y2="10"/>
      <line x1="80" y1="-10" x2="220" y2="10"/>
      <line x1="100" y1="-10" x2="240" y2="10"/>
    </g>
    <!-- Barbell Sleeves -->
    <rect x="-360" y="-18" width="100" height="36" rx="4" fill="#9ca3af" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="260" y="-18" width="100" height="36" rx="4" fill="#9ca3af" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Left Weight Plates (20kg Olympic Cast Iron) -->
    <ellipse cx="-260" cy="0" rx="35" ry="140" fill="#111827" stroke="#ef4444" stroke-width="3.5"/>
    <ellipse cx="-275" cy="0" rx="30" ry="130" fill="#1f2937" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="-290" cy="0" rx="25" ry="115" fill="#111827" stroke="#991b1b" stroke-width="2"/>

    <!-- Right Weight Plates -->
    <ellipse cx="260" cy="0" rx="35" ry="140" fill="#111827" stroke="#ef4444" stroke-width="3.5"/>
    <ellipse cx="275" cy="0" rx="30" ry="130" fill="#1f2937" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="290" cy="0" rx="25" ry="115" fill="#111827" stroke="#991b1b" stroke-width="2"/>

    <!-- Plate Branding text -->
    <text x="-268" y="5" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" transform="rotate(-90 -268 5)">20 KG</text>
    <text x="262" y="5" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" transform="rotate(90 262 5)">20 KG</text>

    <!-- Glowing Collision Ring -->
    <ellipse cx="0" cy="0" rx="80" ry="80" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="10 8" opacity="0.4"/>
  </g>

  <!-- Left Side Project Header -->
  <g transform="translate(80, 80)">
    <rect width="250" height="42" rx="21" fill="#200505" fill-opacity="0.8" stroke="#ef4444" stroke-opacity="0.4"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <text x="38" y="26" fill="#fecaca" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HYPERREALISTIC 3D BRAND</text>
  </g>

  <g transform="translate(80, 200)">
    <text x="0" y="0" fill="#b91c1c" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="3">CASE STUDY // 02</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">IRON &amp; GRIT</text>
    <text x="0" y="95" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600">High-Octane Fitness Brand &amp; 3D Configurator</text>

    <!-- Specs Glass Card -->
    <g transform="translate(0, 150)">
      <rect width="360" height="150" rx="16" fill="#1c0505" fill-opacity="0.8" stroke="#ef4444" stroke-opacity="0.25"/>
      <text x="24" y="38" fill="#ef4444" font-family="monospace" font-size="12" letter-spacing="1.5">REAL-TIME CAPABILITIES</text>
      <text x="24" y="65" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="500">Interactive 3D Barbell Configurator</text>
      <text x="24" y="95" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="500">Spatial Audio Synthesizer &amp; Dynamic FX</text>
      <text x="24" y="125" fill="#ef4444" font-family="monospace" font-size="13" font-weight="600">● Orbit Controls &amp; Dynamic Lighting</text>
    </g>
  </g>

  <!-- Bottom Ribbon -->
  <g transform="translate(80, 640)">
    <rect width="1040" height="52" rx="12" fill="#140202" fill-opacity="0.85" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="30" y="32" fill="#fca5a5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">TECH STACK:</text>
    <text x="140" y="32" fill="#ffffff" font-family="sans-serif" font-size="14">Three.js • Procedural Textures • Web Audio API • PostProcessing Bloom • GSAP</text>
    <text x="960" y="32" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">LIVE DEMO ↗</text>
  </g>
</svg>
