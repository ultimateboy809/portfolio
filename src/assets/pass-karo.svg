    <g transform="translate(0, 150)">
      <rect width="360" height="150" rx="16" fill="#042018" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.25"/>
      <text x="24" y="38" fill="#34d399" font-family="monospace" font-size="12" letter-spacing="1.5">FULL-STACK UTILITY &amp; LOGIC</text>
      <text x="24" y="65" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="500">Calculates Strict Thresholds &amp; Cutoffs</text>
      <text x="24" y="95" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="500">Attendance Bunk Predictor &amp; Safe Margins</text>
      <text x="24" y="125" fill="#34d399" font-family="monospace" font-size="13" font-weight="600">● Offline-First • Instant LocalStorage</text>
    </g>
  </g>

  <!-- Bottom Ribbon -->
  <g transform="translate(80, 640)">
    <rect width="1040" height="52" rx="12" fill="#021a12" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="30" y="32" fill="#6ee7b7" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">TECH STACK:</text>
    <text x="140" y="32" fill="#ffffff" font-family="sans-serif" font-size="14">Vanilla JS • Reactive State Engine • LocalStorage Sync • Responsive Grid CSS</text>
    <text x="960" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">LIVE APP ↗</text>
  </g>
</svg>
