  <g transform="translate(80, 200)">
    <text x="0" y="0" fill="#059669" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="3">CASE STUDY // 04</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">PASS KARO</text>
    <text x="0" y="95" fill="#6ee7b7" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600">BTech Marks Calculator &amp; Attendance Planner</text>

