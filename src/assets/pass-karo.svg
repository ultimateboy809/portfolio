      <text x="220" y="32" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">INTERNAL</text>
      <text x="330" y="32" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">END-SEM TARGET</text>
      <text x="450" y="32" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">STATUS</text>
      
      <line x1="15" y1="45" x2="495" y2="45" stroke="#10b981" stroke-opacity="0.2"/>

      <!-- Rows -->
      <text x="20" y="75" fill="#f3f4f6" font-family="sans-serif" font-size="13">Data Structures &amp; Algo</text>
      <text x="220" y="75" fill="#e5e7eb" font-family="monospace" font-size="13">28 / 30</text>
      <text x="330" y="75" fill="#34d399" font-family="monospace" font-size="13">42 / 70 (Easy)</text>
      <text x="450" y="75" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">PASSED</text>

      <line x1="15" y1="95" x2="495" y2="95" stroke="#10b981" stroke-opacity="0.1"/>

      <text x="20" y="125" fill="#f3f4f6" font-family="sans-serif" font-size="13">Computer Networks</text>
      <text x="220" y="125" fill="#e5e7eb" font-family="monospace" font-size="13">25 / 30</text>
      <text x="330" y="125" fill="#34d399" font-family="monospace" font-size="13">45 / 70</text>
      <text x="450" y="125" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">PASSED</text>

      <line x1="15" y1="145" x2="495" y2="145" stroke="#10b981" stroke-opacity="0.1"/>

      <text x="20" y="175" fill="#f3f4f6" font-family="sans-serif" font-size="13">Operating Systems</text>
      <text x="220" y="175" fill="#e5e7eb" font-family="monospace" font-size="13">29 / 30</text>
      <text x="330" y="175" fill="#38bdf8" font-family="monospace" font-size="13">38 / 70</text>
      <text x="450" y="175" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">PASSED</text>
    </g>
  </g>

  <!-- Left Side Project Header -->
  <g transform="translate(80, 80)">
    <rect width="270" height="42" rx="21" fill="#022c22" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="24" cy="21" r="5" fill="#10b981"/>
    <text x="38" y="26" fill="#a7f3d0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PRACTICAL WEB APPLICATION</text>
