<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="steelGlow" cx="65%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2430" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0c0e14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#steelGlow)"/>

  <!-- Minimalist High-Precision Architectural Grid -->
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <circle cx="750" cy="350" r="170" fill="#38bdf8" opacity="0.1" filter="url(#iceGlow)"/>

  <!-- 3D Technical Jacket Silhouette / Configurator Viewport -->
  <g transform="translate(750, 360)">
    <!-- 360 Orbit Ring -->
    <ellipse cx="0" cy="180" rx="220" ry="60" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="215" cy="175" r="5" fill="#38bdf8"/>
    <circle cx="-215" cy="175" r="5" fill="#94a3b8"/>
    <text x="-45" y="210" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">360° ORBIT VIEW</text>

    <!-- Stylized Technical Parka Silhouette -->
    <!-- Collar & Hood -->
    <path d="M-60,-170 C-40,-200 40,-200 60,-170 C40,-130 -40,-130 -60,-170 Z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <path d="M-40,-160 C-20,-175 20,-175 40,-160" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Main Torso & Sleeves -->
    <path d="M-60,-150 L-150,-50 L-130,-20 L-80,-70 L-80,120 L80,120 L80,-70 L130,-20 L150,-50 L60,-150 Z" 
          fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Center Magnetic Storm Flap / Zipper Line -->
    <line x1="0" y1="-140" x2="0" y2="120" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-3" y1="-140" x2="-3" y2="120" stroke="#0f172a" stroke-width="1"/>

    <!-- Waterproof Chest Pockets -->
    <rect x="-60" y="-40" width="45" height="60" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect x="15" y="-40" width="45" height="60" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-38" y1="-30" x2="-38" y2="10" stroke="#94a3b8" stroke-width="2"/>
    <line x1="38" y1="-30" x2="38" y2="10" stroke="#94a3b8" stroke-width="2"/>

    <!-- Material Configurator Floating Swatch Nodes -->
    <g transform="translate(160, -90)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="40" r="14" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="80" r="14" fill="#1e3a5f" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="120" r="14" fill="#2d3748" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Left Side Project Header -->
  <g transform="translate(80, 80)">
    <rect width="260" height="42" rx="21" fill="#111827" fill-opacity="0.85" stroke="#94a3b8" stroke-opacity="0.3"/>
    <circle cx="24" cy="21" r="5" fill="#38bdf8"/>
    <text x="38" y="26" fill="#f1f5f9" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">3D PRODUCT CONFIGURATOR</text>
  </g>

  <g transform="translate(80, 200)">
    <text x="0" y="0" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="3">CASE STUDY // 03</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">MERIDIAN</text>
    <text x="0" y="95" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600">3D E-Commerce Technical Apparel Platform</text>

    <!-- Specs Glass Card -->
    <g transform="translate(0, 150)">
      <rect width="360" height="150" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-opacity="0.3"/>
      <text x="24" y="38" fill="#38bdf8" font-family="monospace" font-size="12" letter-spacing="1.5">COMMERCE &amp; 3D PIPELINE</text>
      <text x="24" y="65" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="500">Real-Time PBR Material Shader Swapping</text>
      <text x="24" y="95" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="500">Interactive Cart Drawer &amp; Size Guide</text>
      <text x="24" y="125" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">● 360° Studio Lighting Environment</text>
    </g>
  </g>

  <!-- Bottom Ribbon -->
  <g transform="translate(80, 640)">
    <rect width="1040" height="52" rx="12" fill="#0b0f17" fill-opacity="0.85" stroke="#475569" stroke-opacity="0.3"/>
    <text x="30" y="32" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">TECH STACK:</text>
    <text x="140" y="32" fill="#ffffff" font-family="sans-serif" font-size="14">Three.js • PBR Materials • OrbitControls • Audio Feedback FX • Vite</text>
    <text x="960" y="32" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">LIVE DEMO ↗</text>
  </g>
</svg>
